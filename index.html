<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Meu protocolo</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1b19;--mu:#6d6a63;--ln:#e6e3dc;--ok:#2f8f5b;--pa:#c98a14;--no:#c4453c;--wa:#8a8780;--ac:#2f8f5b}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--tx:#f0eee8;--mu:#a19e96;--ln:#2e2d2a;--ok:#4fb67d;--pa:#e0a63a;--no:#e06a60;--wa:#77746d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0}.sub{color:var(--mu);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 10px;font-weight:600}
.big{display:flex;align-items:baseline;gap:10px}.big b{font-size:40px;line-height:1}.big span{color:var(--mu)}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--ac)}
ul{list-style:none;margin:0;padding:0}li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}li:first-child{border-top:0}
.ic{width:22px;text-align:center;flex:none}.t{flex:1}.h{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.st-futuro .t,.st-nao_enviado .t{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.d{aspect-ratio:1;border-radius:6px;border:1px solid var(--ln);background:transparent;color:var(--tx);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit}
.d.sel{outline:2px solid var(--tx);outline-offset:1px}.d.vazio{cursor:default;color:var(--wa)}
.leg{display:flex;gap:12px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{background:var(--bg);border-radius:10px;padding:10px}.stats b{font-size:22px;display:block}.stats span{color:var(--mu);font-size:12px}
.vazia{color:var(--mu);text-align:center;padding:30px 0}
</style></head><body><main>
<h1>Meu protocolo</h1><div class="sub" id="sub">Carregando…</div>
<div id="app"></div>
</main><script>
const IC={feito:"✅",parcial:"⚠️",nao:"❌",pendente:"🕒",sem_resposta:"⏳",nao_enviado:"▫️",futuro:"·"};
const TX={pendente:"aguardando resposta",sem_resposta:"sem resposta",nao_enviado:"não enviado"};
const DOW=["dom","seg","ter","qua","qui","sex","sáb"];
const API="https://trfoktyvxwwjtvxzsygr.supabase.co/functions/v1/protocolo";
const k=new URLSearchParams(location.hash.slice(1)).get("k")||new URLSearchParams(location.search).get("k");
let D=null,sel=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d.slice(8,10)+"/"+d.slice(5,7);
const placar=dia=>{const f=dia.itens.filter(i=>i.status==="feito").length,p=dia.itens.filter(i=>i.status==="parcial").length;return{f,p,t:dia.itens.length,pct:Math.round(f/dia.itens.length*100)}};
const cor=(pct,a)=>"color-mix(in srgb, var(--ok) "+Math.max(12,pct)+"%, transparent)";
function lista(dia){return '<ul>'+dia.itens.map(i=>'<li class="st-'+i.status+'"><span class="ic">'+IC[i.status]+'</span><span class="t">'+esc(i.titulo)+(TX[i.status]?' <span class="h">· '+TX[i.status]+'</span>':'')+'</span><span class="h">'+(i.respondido?'resp. '+i.respondido:i.hora)+'</span></li>').join("")+'</ul>'}
function render(){
  const app=document.getElementById("app");
  if(!D.dias.length){document.getElementById("sub").textContent="O protocolo começa em "+fmt(D.inicio);app.innerHTML='<div class="card vazia">Ainda não há resultados.</div>';return}
  const hoje=D.dias[D.dias.length-1];if(sel==null)sel=hoje.n;
  const atual=D.dias.find(d=>d.n===sel)||hoje;
  document.getElementById("sub").textContent="Dia "+Math.min(D.dia_atual,D.total_dias)+" de "+D.total_dias+" · semana "+Math.ceil(Math.min(D.dia_atual,D.total_dias)/7)+" · água: meta de "+String(D.meta_agua).replace(".",",")+" L · atualizado "+D.hora;
  const pc=placar(atual);
  let html='<div class="card"><h2>'+(atual.hoje?"Hoje":DOW[atual.dow]+", "+fmt(atual.dia))+' · dia '+atual.n+'</h2><div class="big"><b>'+pc.f+'/'+pc.t+'</b><span>'+pc.pct+'% das metas'+(pc.p?' · '+pc.p+' em parte':'')+'</span></div><div class="bar"><i style="width:'+pc.pct+'%"></i></div>'+lista(atual)+'</div>';
  // histórico
  html+='<div class="card"><h2>Os '+D.total_dias+' dias</h2><div class="grid">';
  for(let n=1;n<=D.total_dias;n++){const d=D.dias.find(x=>x.n===n);if(!d){html+='<button class="d vazio" disabled>'+n+'</button>';continue}const p=placar(d);html+='<button class="d'+(n===sel?' sel':'')+'" data-n="'+n+'" style="background:'+cor(p.pct)+'" title="'+fmt(d.dia)+': '+p.pct+'%">'+n+'</button>'}
  html+='</div><div class="leg"><span><i style="background:'+cor(100)+'"></i>tudo feito</span><span><i style="background:'+cor(50)+'"></i>metade</span><span><i style="background:'+cor(0)+'"></i>pouco</span><span>toque num dia para ver</span></div></div>';
  // números
  const fechados=D.dias.filter(d=>!d.hoje);let seq=0;
  const todos=[...D.dias].reverse();for(const d of todos){const p=placar(d);if(p.f===p.t)seq++;else if(!d.hoje)break}
  const media=fechados.length?Math.round(fechados.reduce((a,d)=>a+placar(d).pct,0)/fechados.length):null;
  const falta={};for(const d of D.dias)for(const i of d.itens)if(["nao","sem_resposta","nao_enviado"].includes(i.status))falta[i.titulo]=(falta[i.titulo]||0)+1;
  const top=Object.entries(falta).sort((a,b)=>b[1]-a[1]).slice(0,5);
  html+='<div class="card"><h2>Números</h2><div class="stats"><div><b>'+seq+'</b><span>dias seguidos com tudo feito</span></div><div><b>'+(media==null?"—":media+"%")+'</b><span>média dos dias completos</span></div></div></div>';
  html+='<div class="card"><h2>Mais esquecidos</h2>'+(top.length?'<ul>'+top.map(([t,c])=>'<li><span class="ic">❌</span><span class="t">'+esc(t)+'</span><span class="h">'+c+(c>1?' vezes':' vez')+'</span></li>').join("")+'</ul>':'<div class="h">Nada esquecido até agora 🎉</div>')+'</div>';
  app.innerHTML=html;
  app.querySelectorAll(".d[data-n]").forEach(b=>b.onclick=()=>{sel=+b.dataset.n;render();window.scrollTo({top:0,behavior:"smooth"})});
}
async function carregar(){if(!k){document.getElementById("sub").textContent="Link sem a chave de acesso.";return}try{const r=await fetch(API+"?acao=dados&k="+encodeURIComponent(k),{cache:"no-store"});if(!r.ok)throw 0;D=await r.json();render()}catch(e){document.getElementById("sub").textContent="Não consegui carregar agora. Tentando de novo…"}}
carregar();setInterval(carregar,60000);
</script></body></html>
